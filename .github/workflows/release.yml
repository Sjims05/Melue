# A release, at the end of a phase: pushing its version tag (v0.6.0: a phase's versions end in .0; the steps' don't, and
# make no release) builds Melue for Windows here (or Run workflow on GitHub, for a tag), signs its update with Melue's key
# (the repository secret TAURI_SIGNING_PRIVATE_KEY), and makes a draft release with the installer, the update and
# latest.json, its notes from CHANGELOG.md. Publishing the draft (on GitHub) makes it the latest release: installed
# copies then update to it (src/lib/updates.ts). Drafts and pre-releases never reach them.
name: Release
# Each run named by its version (a run by hand would otherwise say only "Release").
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*.*.0']
  # By hand (Actions → Release → Run workflow): the tag to build (an existing one, say v0.6.0).
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build (v0.6.0)
        required: true

# The tag built: the pushed one, or the one asked for.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Melue, and its player plugin beside it (as on the development PC: ../tauri-plugin-native-audio).
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: melue
      - uses: actions/checkout@v4
        with:
          repository: Sjims05/tauri-plugin-native-audio
          path: tauri-plugin-native-audio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: melue/src-tauri -> target

      # The version's notes: its section of CHANGELOG.md, without the heading.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          {
            echo 'text<<END_OF_NOTES'
            awk -v v="$version" '/^## /{ p = index($0, "## " v " ") == 1; next } p' melue/CHANGELOG.md
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      # Without the private test-build helper (tauri-dev-scripts: installing on a phone over USB), which a release
      # doesn't need and this machine can't fetch.
      - name: Install packages
        working-directory: melue
        shell: bash
        run: |
          npm pkg delete devDependencies.tauri-dev-scripts
          npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: melue
          tagName: ${{ env.TAG }}
          releaseName: Melue ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.text }}
          releaseDraft: true
          includeUpdaterJson: true

  # The phone's APK, added to the same draft release (phones update from it: src-tauri/src/phone_update.rs). Signed
  # with Melue's Android release key (the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
  # ANDROID_STORE_PASSWORD): Android installs an update only when it's signed like the installed app.
  android:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: melue
      - uses: actions/checkout@v4
        with:
          repository: Sjims05/tauri-plugin-native-audio
          path: tauri-plugin-native-audio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: melue/src-tauri -> target

      - name: Signing key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
          } > melue/src-tauri/gen/android/keystore.properties

      - name: Install packages
        working-directory: melue
        shell: bash
        run: |
          npm pkg delete devDependencies.tauri-dev-scripts
          npm install --no-audit --no-fund

      - name: Build the APK
        working-directory: melue
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # The official app (not the test build, Melue Dev: build.gradle.kts).
          export MELUE_RELEASE=1
          npx tauri android build --apk --target aarch64

      - name: Add it to the release
        working-directory: melue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Melue_${version}_android.apk"
          gh release upload "$TAG" "Melue_${version}_android.apk" --clobber
