# Bug reports sent from Melue (src/lib/report/report.ts) are issues opened by the reporter's own GitHub account, which
# can't set labels; their text carries a mark this recognises, and it adds "bug" and "from the app".
name: Label reports from the app

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.body, '<!-- melue-report -->')
    runs-on: ubuntu-latest
    steps:
      - name: Add the labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "bug" --add-label "from the app"
