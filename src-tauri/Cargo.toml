[package]
name = "melue"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "melue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-persisted-scope = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
smb2 = "0.11"
# Playback on every platform (its `mobile` and `desktop` features, both on by default).
tauri-plugin-native-audio = { path = "../../tauri-plugin-native-audio" }
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "29.0.0"


# Dev builds: optimize the dependencies (the audio decoding and resampling in native-audio would
# be too slow to play smoothly otherwise). Only Melue's own code stays unoptimized, so rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
