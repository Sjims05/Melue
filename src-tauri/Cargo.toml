[package]
name = "melue"
version = "0.3.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "melue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-persisted-scope = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# The music library: its SQLite database (compiled in, so it's the same on every platform) and tag reading.
rusqlite = { version = "0.40", features = ["bundled"] }
lofty = "0.25"
# Covers: shrinking them (JPEG, PNG and WebP only), and recognising the same cover in many songs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Sorting and grouping names without their accents (Ólafur with the O's).
unicode-normalization = "0.1"
smb2 = "0.11"
# Playback on every platform (its `mobile` and `desktop` features, both on by default).
tauri-plugin-native-audio = { path = "../../tauri-plugin-native-audio" }
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "29.0.0"
# Melue's own Android code: the music permission and Android's music index.
tauri-plugin-melue-android = { path = "plugins/melue-android" }


# Dev builds: optimize the dependencies (the audio decoding and resampling in native-audio would
# be too slow to play smoothly otherwise). Only Melue's own code stays unoptimized, so rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
